<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate bill tips and split amounts among multiple people">
    <title>Bill Calculator - Split Bills & Calculate Tips</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/8f1d54c877.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo-container">
          <span style="font-size: 3em; color: white;" aria-hidden="true">
            <i class="fas fa-calculator"></i>
          </span>
          <h1>Bill Calculator</h1>
        </div>
        <nav class="navbar">
          <ul class="unordered">
            <li><a href="#main" aria-current="page">Main</a></li>
            <li><a href="#about">About</a></li>
          </ul>
        </nav>
      </header>
      
      <main class="body" id="main">
        <section class="calculator">
          <div class="calculator-header">
              <span style="font-size: 2em; color: #7DD181;" aria-hidden="true">
                <i class="fas fa-calculator"></i>
              </span>
              <h2>Bill Calculator</h2>
          </div>
          <div class="calculator-body">
            <form id="form" novalidate>
              <div class="form-section">
                <label for="num-ppl">Number of People: </label>
                <input type="number" name="num-ppl" id="num-ppl" min="1" max="100" required
                       aria-describedby="num-ppl-error" placeholder="e.g., 4">
                <div id="num-ppl-error" class="error-message" aria-live="polite"></div>
              </div>
              
              <div class="form-section">
                <label for="bill">Bill Amount: $</label>
                <input type="number" name="bill" id="bill" min="0" step="0.01" required
                       aria-describedby="bill-error" placeholder="e.g., 125.50">
                <div id="bill-error" class="error-message" aria-live="polite"></div>
              </div>
              
              <div class="form-section">
                <label for="tip-per">Tip Percentage: </label>
                <select name="tip-per" id="tip-per" required aria-describedby="tip-per-error">
                    <option value="">Select tip percentage</option>
                    <option value="5">5%</option>
                    <option value="10">10%</option>
                    <option value="15">15%</option>
                    <option value="18">18%</option>
                    <option value="20">20%</option>
                    <option value="25">25%</option>
                </select>
                <div id="tip-per-error" class="error-message" aria-live="polite"></div>
              </div>
              
              <div class="form-section">
                <input type="submit" value="Calculate" name="submit" id="submit" 
                       aria-describedby="result-container">
                <div class="loading" id="loading" aria-hidden="true">Calculating...</div>
              </div>
            </form>
          </div>
        </section>
        
        <section class="result-container" id="result-container" aria-live="polite">
          <!-- Results will be displayed here -->
        </section>
      </main>
    </div>
    <script src="bill.js"></script>
  </body>
</html>
